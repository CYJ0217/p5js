<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5.js Visual Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* 브라운 & 핑크 톤 팔레트 */
        :root {
            --bg-color: #fdf6f7;        /* 연한 핑크베이지 배경 */
            --card-bg: #ffffff;         /* 카드 배경 */
            --primary-brown: #6f4e37;   /* 딥 브라운 */
            --accent-pink: #d1a6b4;     /* 인디 핑크 */
            --text-main: #4a2c2a;       /* 텍스트용 다크 브라운 */
            --card-shadow: 0 8px 16px rgba(111, 78, 55, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 2rem;
            color: var(--primary-brown);
            margin-bottom: 35px;
            text-align: center;
            border-bottom: 3px solid var(--accent-pink);
            padding-bottom: 8px;
        }

        /* 2행 2열 고정 구조 (너비 고정) */
        #projects {
            display: grid;
            grid-template-columns: 300px 300px;
            gap: 25px;
            width: 100%;
            max-width: 630px;
        }

        /* 카드 디자인 */
        #projects .project-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(209, 166, 180, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 과제 타이틀 영역 */
        .card-header {
            padding: 12px 15px;
            background-color: #f8f1ef;
            border-bottom: 1px solid rgba(209, 166, 180, 0.2);
            font-weight: 600;
            color: var(--primary-brown);
            font-size: 0.85rem;
        }

        /* [교정] 네이비 배경 짤림 및 흰 여백 방지 래퍼 */
        .iframe-wrapper {
            width: 300px;
            height: 200px;
            position: relative;
            overflow: hidden;
            /* 과제 2, 3의 네이비 배경과 동심원의 어두운 톤이 부드럽게 이어지도록 어두운 배경색 지정 */
            background: #0f172a;
        }

        /* [교정] 기본 마진으로 인한 짤림을 방지하기 위해 크기를 미세하게 조정하고 여백 압축 */
        #projects .project-card iframe {
            position: absolute;
            top: -4px;  /* 💡 iframe 내부 기본 body 마진(8px * 0.5)으로 인한 밀림 현상 상쇄 */
            left: -4px; /* 💡 좌측 밀림 현상 상쇄 */
            width: 616px; /* 여백 공간을 고려한 렌더링 영역 확보 */
            height: 416px;
            border: none;
            transform-origin: top left;
            transform: scale(0.5); /* 600x400 원본 크기를 비율 손상 없이 절반으로 축소 */
        }
    </style>
</head>
<body>

<h1>Visual Portfolio</h1>

<main id="projects">

    <div class="project-card">
        <div class="card-header">과제 1 | 정적 추상화 디자인</div>
        <div class="iframe-wrapper">
            <iframe src="sample1/index.html" scrolling="no"></iframe>
        </div>
    </div>

    <div class="project-card">
        <div class="card-header">과제 4 | 시간에 따른 움직임</div>
        <div class="iframe-wrapper">
            <iframe src="sample4/index.html" scrolling="no"></iframe>
        </div>
    </div>

    <div class="project-card">
        <div class="card-header">과제 2 | 반복 패턴 그래픽스</div>
        <div class="iframe-wrapper">
            <iframe src="sample2/index.html" scrolling="no"></iframe>
        </div>
    </div>

    <div class="project-card">
        <div class="card-header">과제 3 | 인터랙티브 아트</div>
        <div class="iframe-wrapper">
            <iframe src="sample3/index.html" scrolling="no"></iframe>
        </div>
    </div>

</main>

</body>
</html>
