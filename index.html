<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5.js Artworks Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background Gradient */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.15), transparent 50%),
            radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15), transparent 40%);
            z-index: -1;
            animation: ambientBg 15s linear infinite;
        }

        @keyframes ambientBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        header {
            width: 100%;
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        main {
            width: 100%;
            max-width: 1200px;
            padding: 0 20px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
            0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .iframe-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2; /* Matches 600x400 sketch size */
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 400px;
            border: none;
            transform-origin: 0 0;
            background: #fff; /* Default background for sketches */
        }

        .card-info {
            padding: 0 8px 8px;
        }

        .card-info h2 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .card-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<header>
    <h1>p5.js Artworks</h1>
    <p class="subtitle">A collection of creative coding experiments</p>
</header>

<main id="projects">
    <div class="project-card">
        <div class="iframe-container">
            <iframe src="sample1/index.html" loading="lazy"></iframe>
        </div>
        <div class="card-info">
            <h2>Sketch 1</h2>
            <p>Generative geometric composition</p>
        </div>
    </div>

    <div class="project-card">
        <div class="iframe-container">
            <iframe src="sample2/index.html" loading="lazy"></iframe>
        </div>
        <div class="card-info">
            <h2>Sketch 2</h2>
            <p>Interactive visual experiment</p>
        </div>
    </div>

    <div class="project-card">
        <div class="iframe-container">
            <iframe src="sample3/index.html" loading="lazy"></iframe>
        </div>
        <div class="card-info">
            <h2>Sketch 3</h2>
            <p>Algorithmic art exploration</p>
        </div>
    </div>

    <div class="project-card">
        <div class="iframe-container">
            <iframe src="sample4/index.html" loading="lazy"></iframe>
        </div>
        <div class="card-info">
            <h2>Sketch 4</h2>
            <p>Dynamic particle system</p>
        </div>
    </div>
</main>

<script>
    function scaleIframes() {
        const containers = document.querySelectorAll('.iframe-container');
        containers.forEach(container => {
            const width = container.clientWidth;
            // p5.js sketches are 600px wide
            const scale = width / 600;
            const iframe = container.querySelector('iframe');
            if (iframe) {
                iframe.style.transform = `scale(${scale})`;
            }
        });
    }

    // Scale on resize and load
    window.addEventListener('resize', scaleIframes);
    window.addEventListener('load', scaleIframes);

    // Also scale immediately in case load event is delayed
    scaleIframes();

    // Use ResizeObserver to keep iframes scaled perfectly as container changes
    const observer = new ResizeObserver(() => {
        scaleIframes();
    });
    const main = document.querySelector('main');
    if (main) observer.observe(main);
</script>

</body>
</html>
