<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5.js Visual Portfolio</title>

    <style>
        /* 고급스러운 딥 네이비 & 슬레이트 톤 팔레트 */
        :root {
            --bg-color: #0f172a;        /* 베이스 배경: 딥 네이비 */
            --card-bg: #1e293b;         /* 카드 배경: 미드나잇 네이비 */
            --card-header-bg: #334155;  /* 카드 헤더: 다크 슬레이트 */
            --text-main: #f8fafc;       /* 메인 텍스트: 화이트 스노우 */
            --text-muted: #94a3b8;      /* 서브 텍스트: 실버 그레이 */
            --accent-blue: #38bdf8;     /* 포인트 컬러: 일렉트릭 블루 */
            --card-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 사용자가 선호하는 깔끔한 시스템 폰트 스택 적용 */
            font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 50px 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        /* 타이틀 하단 포인트 라인 */
        h1::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--accent-blue);
            margin: 12px auto 0 auto;
            border-radius: 2px;
        }

        /* 2행 2열 고정 구조 (정확한 대칭 그리드) */
        #projects {
            display: grid;
            grid-template-columns: 300px 300px;
            gap: 30px;
            width: 100%;
            max-width: 630px;
        }

        /* 프리미엄 카드 디자인 */
        #projects .project-card {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 과제 타이틀 영역 */
        .card-header {
            padding: 14px 18px;
            background-color: var(--card-header-bg);
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.88rem;
            letter-spacing: -0.3px;
        }

        /* 💡 스크롤바 원천 차단을 위한 고정 프레임 래퍼 */
        .iframe-wrapper {
            width: 300px;
            height: 200px;
            position: relative;
            overflow: hidden; /* 외곽 스크롤바 방지 */
            background: #0f172a;
        }

        /* 💡 내부 마진(8px)을 포함한 하드웨어 스케일링 연산 교정 */
        #projects .project-card iframe {
            position: absolute;
            top: -4px;   /* 마진의 절반만큼 상단 정렬 */
            left: -4px;  /* 마진의 절반만큼 좌측 정렬 */
            width: 608px; /* 600px 캔버스 + 브라우저 기본 마진 8px */
            height: 408px;/* 400px 캔버스 + 브라우저 기본 마진 8px */
            border: none;
            transform-origin: top left;
            transform: scale(0.5); /* 0.5배 정확히 압축 */
            overflow: hidden; /* 내부 스크롤바 방지 */
        }
    </style>
</head>
<body>

<h1>Visual Portfolio</h1>

<main id="projects">

    <div class="project-card">
        <div class="card-header">과제 1 | 정적 추상화 디자인</div>
        <div class="iframe-wrapper">
            <iframe src="sample1/index.html" scrolling="no"></iframe>
        </div>
    </div>

    <div class="project-card">
        <div class="card-header">과제 4 | 시간에 따른 움직임</div>
        <div class="iframe-wrapper">
            <iframe src="sample4/index.html" scrolling="no"></iframe>
        </div>
    </div>

    <div class="project-card">
        <div class="card-header">과제 2 | 반복 패턴 그래픽스</div>
        <div class="iframe-wrapper">
            <iframe src="sample2/index.html" scrolling="no"></iframe>
        </div>
    </div>

    <div class="project-card">
        <div class="card-header">과제 3 | 인터랙티브 아트</div>
        <div class="iframe-wrapper">
            <iframe src="sample3/index.html" scrolling="no"></iframe>
        </div>
    </div>

</main>

</body>
</html>
