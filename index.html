<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5.js Visual Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* 1. 디자인 컨셉: 브라운 & 핑크 톤 팔레트 설정 */
        :root {
            --bg-color: #fdf6f7;        /* 아주 연한 핑크베이지 배경 */
            --card-bg: #ffffff;         /* 순백색 카드 */
            --primary-brown: #6f4e37;   /* 메인 커피 브라운 (제목, 테두리) */
            --accent-pink: #d1a6b4;     /* 다운된 인디 핑크 (포인트 색상) */
            --text-main: #4a2c2a;       /* 진한 브라운 본문 텍스트 */
            --card-shadow: 0 10px 20px rgba(111,78,55,0.08); /* 부드러운 브라운 그림자 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 2.2rem;
            color: var(--primary-brown);
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 3px solid var(--accent-pink);
            padding-bottom: 10px;
        }

        /* 2. 레이아웃 개선: 그리드 여백 및 너비 확장 */
        #projects {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2행 2열 유지 */
            width: 100%;
            max-width: 1000px; /* 더 넓게 확장 (세련된 느낌) */
            gap: 30px; /* 카드 사이 간격 넓힘 */
        }

        /* 3. 카드 디자인 개선: 심미성 강화 및 크기 조정 */
        #projects .project-card {
            background: var(--card-bg);
            border-radius: 16px; /* 더 둥글게 */
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(209, 166, 180, 0.2); /* 연한 핑크 테두리 */
            overflow: hidden; /* 내부 요소가 테두리를 넘지 않도록 */
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* 호버 효과 */
        }

        /* 마우스 호버 시 효과 */
        #projects .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(111,78,55,0.15);
        }

        /* 카드 상단 헤더 추가 (과제 제목 표시) */
        .card-header {
            padding: 15px 20px;
            background-color: #f8f1ef; /* 아주 연한 브라운 핑크 */
            border-bottom: 1px solid rgba(209, 166, 180, 0.3);
            font-weight: 600;
            color: var(--primary-brown);
            font-size: 0.95rem;
        }

        /* 4. 작품 짤림 방지 핵심: 비율 유지 크기 조정 */
        .iframe-container {
            width: 100%;
            /* ★ p5.js 캔버스 표준 비율(600x400 = 3:2) 유지 ★ */
            aspect-ratio: 3 / 2;
            position: relative;
            background: #FFF; /* p5.js 로딩 전 배경 */
        }

        #projects .project-card iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block; /* iframe 하단 여백 제거 */
        }

        /* 반응형: 모바일 화면에서는 1열로 나열 */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            #projects { grid-template-columns: 1fr; gap: 20px; }
        }

    </style>
</head>
<body>

<h1>Visual Portfolio</h1>

<main id="projects">

    <div class="project-card">
        <div class="card-header">정적 추상화 디자인 (과제 1)</div>
        <div class="iframe-container">
            <iframe src="sample1/index.html"></iframe>
        </div>
    </div>

    <div class="project-card">
        <div class="card-header">시간에 따른 움직임 (과제 4)</div>
        <div class="iframe-container">
            <iframe src="sample4/index.html"></iframe>
        </div>
    </div>

    <div class="project-card">
        <div class="card-header">반복 패턴 그래픽스 (과제 2)</div>
        <div class="iframe-container">
            <iframe src="sample2/index.html"></iframe>
        </div>
    </div>

    <div class="project-card">
        <div class="card-header">인터랙티브 아트 (과제 3)</div>
        <div class="iframe-container">
            <iframe src="sample3/index.html"></iframe>
        </div>
    </div>

</main>

</body>
</html>
